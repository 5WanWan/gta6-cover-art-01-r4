<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunset Heist — Comic Cover Studio</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls">
    <h1>Sunset Heist</h1>
    <p class="tag">Comic Cover Studio — turn any photo into GTA-style cover art.</p>

    <label>Title
      <input id="title" type="text" maxlength="24" value="SUNSET HEIST">
    </label>
    <label>Subtitle (script)
      <input id="subtitle" type="text" maxlength="32" value="Vice City nights">
    </label>
    <label>Tagline
      <input id="tagline" type="text" maxlength="48" value="TWO OUTLAWS · ONE LAST SCORE">
    </label>
    <label>Bottom strip
      <input id="strip" type="text" maxlength="48" value="PALMS · NEON · NO RULES · COMING SOON">
    </label>

    <div class="group">
      <span class="group-label">Photos — tap one for the selected panel</span>
      <div id="samples" class="thumbs"></div>
      <label class="upload">Upload your own photo
        <input id="photo" type="file" accept="image/*">
      </label>
    </div>

    <div class="group">
      <span class="group-label" id="panel-label">Panel 1</span>
      <label>Zoom <input id="zoom" type="range" min="1" max="2.5" step="0.05" value="1"></label>
      <label>Pan left–right <input id="panx" type="range" min="-60" max="60" step="1" value="0"></label>
      <label>Pan up–down <input id="pany" type="range" min="-60" max="60" step="1" value="0"></label>
      <p class="hint">Click a panel on the cover to pick it, then drag it to move the photo.</p>
    </div>

    <div class="group">
      <span class="group-label">Comic layout</span>
      <div id="layouts" class="picks"></div>
    </div>
    <div class="group">
      <span class="group-label">Colour grade</span>
      <div id="grades" class="picks"></div>
    </div>
    <div class="group">
      <span class="group-label">Export size</span>
      <div id="sizes" class="picks"></div>
    </div>

    <button id="export" type="button">Export PNG</button>
    <p id="status" role="status"></p>
  </section>
  <section class="preview">
    <canvas id="cover" width="960" height="540" aria-label="The cover"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
